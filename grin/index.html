<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="fermat.jpg" />
        <script src="dist/index.js" type="module"></script>
        <title>Difraction is cool</title>
        <style>
            * {
                margin: 10px;
            }
            .param-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 8px;
            }
            .param-row label {
                width: 120px;
            }
            .param-row input[type="range"] {
                width: 220px;
            }
            .param-row input[type="number"] {
                width: 90px;
            }
        </style>
    </head>
    <body onload="start()">
        <canvas id="c" style="border: 2px solid #000000"></canvas>
        
        <div style="border: 2px solid black; width: fit-content; padding: 5px">
            <label>Experiment parameters</label>
            <div class="param-row">
                <label for="slider_n1">n1 </label>
                <input id="slider_n1" type="range" min="1.0" max="2.0" step="0.01" />
                <input id="input_n1" type="number" min="1.0" max="2.0" step="0.01" />
            </div>
            <div class="param-row">
                <label for="slider_delta">Delta</label>
                <input id="slider_delta" type="range" min="0.000" max="0.100" step="0.001" />
                <input id="input_delta" type="number" min="0.000" max="0.100" step="0.001" />
            </div>
            <div class="param-row">
                <label for="slider_num_regions">Nombre de regions</label>
                <input id="slider_num_regions" type="range" min="2" max="300" step="1" />
                <input id="input_num_regions" type="number" min="2" max="300" step="1" />
            </div>
            <div class="param-row">
                <label for="slider_angle_raig">Angle Raig</label>
                <input id="slider_angle_raig" type="range" min="1" max="30" step="0.1" />
                <input id="input_angle_raig" type="number" min="1" max="30" step="0.1" />
            </div>
            <div class="param-row">
                <label for="slider_aspect_ratio">Aspect Ratio</label>
                <input id="slider_aspect_ratio" type="range" min="1" max="100" step="0.01" />
                <input id="input_aspect_ratio" type="number" min="1" max="100" step="0.01" />
            </div>
            <div class="param-row">
                <label for="slider_alpha">Alpha</label>
                <input id="slider_alpha" type="range" min="0.2" max="6.0" step="0.1" />
                <input id="input_alpha" type="number" min="0.2" max="6.0" step="0.1" />
            </div>
        </div>   
    </body>
</html>
