<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="fermat.jpg" />
        <script src="dist/index.js" type="module"></script>
        <title>Fibra òptica GRIN</title>
        <style>
            * {
                margin: 10px;
            }
            .param-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 8px;
            }
            .param-row label {
                width: 120px;
            }
            .param-row input[type="range"] {
                width: 220px;
            }
            .param-row input[type="number"] {
                width: 90px;
            }
            .grid-container {
                display: grid;
                grid-template-columns: min-content min-content auto;
            }

            .grid-container div {
                padding: 10px;
                font-size: 30px;
                text-align: center;
            }

            .vertical-size-display {
                max-width: 2em;
                border-left: 1px solid black;
                writing-mode: vertical-lr;
                text-orientation: mixed;
                font-size: 5;
            }
            .horizontal-size-display {
                border-top: 1px solid black;
                max-height: 2em;
                font-size: 5;
            }
            .regular-container {
                display:flex; 
                flex-direction:column; 
                border: 2px solid black; 
                width: fit-content; 
                padding: 5px;
            }
        </style>
    </head>
    <body onload="start()">
        <div class="grid-container">
            <canvas id="c" style="border: 2px solid #000000"></canvas>
            <div class="vertical-size-display"> 
                <span>Height = </span>
                <span id="height_display"></span>
                <span> µm</span> 
            </div>
            <span></span>
            <div class="horizontal-size-display"> 
                <span>Width = </span>
                <span id="width_display"></span>
                <span> µm</span> 
            </div>
        </div>
        
        <div style="display: flex;">
            <div class="regular-container">
                <label><b>Experiment parameters</b></label>
                <div class="param-row">
                    <label for="slider_n1">n1 </label>
                    <input id="slider_n1" type="range" min="1.0" max="2.0" step="0.01" />
                    <input id="input_n1" type="number" min="1.0" max="2.0" step="0.01" />
                </div>
                <div class="param-row">
                    <label for="slider_delta">Delta</label>
                    <input id="slider_delta" type="range" min="0.001" max="0.100" step="0.001" />
                    <input id="input_delta" type="number" min="0.001" max="0.100" step="0.001" />
                </div>
                <div class="param-row">
                    <label for="slider_num_regions">Nombre de regions</label>
                    <input id="slider_num_regions" type="range" min="1" max="300" step="1" />
                    <input id="input_num_regions" type="number" min="1" max="300" step="1" />
                </div>
                <div class="param-row">
                    <label for="slider_angle_raig">Angle Raig</label>
                    <input id="slider_angle_raig" type="range" min="0.1" max="60" step="0.1" />
                    <input id="input_angle_raig" type="number" min="0.1" max="60" step="0.1" />
                </div>
                <div class="param-row">
                    <label for="slider_aspect_ratio">Aspect Ratio</label>
                    <input id="slider_aspect_ratio" type="range" min="1" max="100" step="0.01" />
                    <input id="input_aspect_ratio" type="number" min="1" max="100" step="0.01" />
                </div>
                <div class="param-row">
                    <label for="slider_alpha">Alpha</label>
                    <input id="slider_alpha" type="range" min="0.2" max="6.0" step="0.1" />
                    <input id="input_alpha" type="number" min="0.2" max="6.0" step="0.1" />
                </div>
            </div> 
            <div class="regular-container">
                <label for="output"><b>Output</b></label>
                <textarea id="output" rows="20" cols="100"></textarea>
                <button id="print_angles">Print Angles</button>
            </div>
            <div class="regular-container" style="font-size: 20px">
                <label><b>Temps</b></label>
                <div><span id="time_taken">0</span><span>ps</span></div>
                <label>1 picosegon = 10<sup>-12</sup> s</label>
            </div>
        </div>
    </body>
</html>
