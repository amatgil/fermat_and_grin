<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="dist/index.js" type="module"></script>
    <title>Difraction is cool</title>
    <style>
        *{
            margin:10px;
        }
    </style>
</head>
<body onload="start()">
    <canvas id="c" style="width:100%;height:50%; border-color:#000000; border-width:10px"></canvas>
    
    <div style="display: flex; flex-direction: vertical;">
        <label>Amplitude: </label>
        <input id="amplitude" type="range" max="1" min="-1" step="0.01" value="0">
    </div>

    <div style="display: flex; flex-direction: vertical;">
        <label>Lambda (Wave-length): </label>
        <input id="lambda" type="range" max="1" min="-1" step="0.01" value="0">
    </div>

    <div style="display: flex; flex-direction: vertical;">
        <label>Slit-Slit distance: </label>
        <input id="slit-slit" type="range" max="1" min="-1" step="0.01" value="0">
    </div>

    <div style="display: flex; flex-direction: vertical;">
        <label>Slits-Plane distance: </label>
        <input id="slits-plane" type="range" max="1" min="-1" step="0.01" value="0">
    </div>
    <div style="display: flex; flex-direction: vertical;">
        <label>Integral iterations: </label>
        <input id="iter" type="range" max="1" min="-1" step="0.01" value="0">
    </div>
</body>
</html>
