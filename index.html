<!doctype html>
<html lang="en">
    <head>

            <div>
                <label>Indexs de refracció</label>

            </div>
            <div>
                <label>Punt de transició</label>
                <div id="input_heights"></div>

        </div>
        <div style="border: 2px solid black; width: fit-content">
            <label>Indexs de refracció</label>
            <button id="start_animation_button">Inicia Descent</button>
            <button id="stop_animation_button">Para Descent</button>
